
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Memória</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🌸 Desafio da Memória 🌸</h1>
        <p>Encontre todos os pares de cartas iguais!</p>

        <div class="info">
            <span>Jogadas: <strong id="moves">0</strong></span>
            <span>Tempo: <strong id="timer">00:00</strong></span>
        </div>

        <div id="game-board" class="game-board"></div>

        <p id="message"></p>

        <button id="restart">Reiniciar jogo</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
